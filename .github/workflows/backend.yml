name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Тесты backend идут на настоящем PostgreSQL той же версии, что в compose.yaml.
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: openfund
          POSTGRES_PASSWORD: openfund
          POSTGRES_DB: openfund_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openfund -d openfund_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://openfund:openfund@127.0.0.1:5433/openfund_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Тестам нужны контракты из contracts/: forge build собирает их вместе с OpenZeppelin и forge-std.
          submodules: recursive

      # Anvil для интеграционных тестов и forge для pretest — тем же способом, что в job контрактов.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Typecheck backend
        run: npm run typecheck

      # pretest сначала собирает контракты (forge build), затем тесты поднимают свой Anvil.
      - name: Test backend
        run: npm test
