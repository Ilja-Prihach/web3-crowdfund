server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 6m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /demo-rpc {
        set $rpc http://anvil:8545;
        rewrite ^ / break;
        proxy_pass $rpc;
    }
    location /api/ {
        set $api http://backend:4000;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $api;
    }
    location / {
        set $web http://frontend:3000;
        proxy_pass $web;
    }
}
