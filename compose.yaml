# Локальная инфраструктура разработки. Пароль учебный: порт открыт только на 127.0.0.1.
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: openfund
      POSTGRES_PASSWORD: openfund
      POSTGRES_DB: openfund
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Создаёт openfund_test при первом запуске тома: тесты не трогают рабочую БД.
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfund -d openfund"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
